on:
  workflow_call:
    secrets:
      token:
        required: true
      docker_username:
        required: false  # Optional, only required if Docker login is needed
      docker_password:
        required: false  # Optional, only required if Docker login is needed
    inputs:
      docker_url:
        type: string
        required: false
      # When set, skip release-please and publish an existing tag with GoReleaser.
      # Use this to recover from a failed release or race where the GitHub release
      # exists but assets/images were never published.
      tag:
        type: string
        required: false
        default: ""

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ inputs.tag == '' }}
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      sha: ${{ steps.release-please.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          release-type: go

  release:
    runs-on: ubuntu-latest
    needs: release-please
    # Run when release-please created a release, or when a tag was provided for republish.
    # release-please is skipped on republish; always() keeps this job eligible.
    if: ${{ always() && !cancelled() && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Always build the tagged commit, not the workflow trigger SHA.
          # Fixes races where release_created is true on a different push than the tag.
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - run: git fetch --force --tags

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      # Conditionally login to Docker
      - name: Login to docker
        if: ${{ inputs.docker_url }}
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.docker_url }}
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
